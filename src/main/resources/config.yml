# All settings can be changed in game with /ptc (op only); changes are saved here.

# Remove the thrower's horizontal movement from projectiles.   /ptc horizontal on|off
remove-horizontal-inertia: true

# Remove the thrower's vertical movement from projectiles.     /ptc vertical on|off
# off = vertical inertia exactly as vanilla.
remove-vertical-inertia: false

# Wind charges are spawned where the player was this many ticks earlier
# (the aim is the current one).                                  /ptc rewind on|off|<ticks>
# elytra-only: true = only while gliding on elytra.              /ptc rewind elytraonly on|off
# max-angle-from-up: only when aimed within this many degrees of
# straight up (90 = every angle).                                /ptc rewind angle <0-90>
elytra-wind-charge-rewind:
  enabled: true
  ticks: 3
  elytra-only: false
  max-angle-from-up: 5.0

# Size of the hit volume used when a wind charge meets an ender pearl.
# A cube of this many blocks across, centred on the pearl (2 = hits from
# 1 block away). Only pearl/charge hits use this; every other collision
# (blocks, players, mobs) is untouched.                 /ptc hitbox <0.25-10>
hit-diameter: 2.0

#
# The volume starts at the pearl's own size (0.25) when thrown and grows at
# vanilla's projectile hit-margin rate (nothing for 2 ticks, then +0.1 across
# per tick of pearl flight) until it reaches hit-diameter (2.0 -> 20 ticks).
# This is what lets a pearl and charge thrown back to back (instant pearl
# catch) meet in the air instead of right in your hand.
